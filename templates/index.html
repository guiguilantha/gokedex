<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Pokédex</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <h1>Pokédex</h1>
        <div class="grille">
        {{range .}}
            <a class="carte" href="/pokemon/{{.ID}}">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{{.ID}}.png" alt="{{.Name}}">

                <h2>{{.Name}}</h2>
            </a>
        {{end}}
        </div>
    </body>
</html>
